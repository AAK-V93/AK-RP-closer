[project]
name = "gemini-agent"
version = "0.1.0"
description = "LiveKit Agent for Closer Trainer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "livekit>=0.19.0",
    "livekit-agents>=1.3.5",
    "livekit-plugins-google>=1.3.5",
    "python-dotenv",
    "google-genai>=1.47.0",
    "packaging>=21.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Flat scripts, not a package. Without this, `uv pip install --system .`
# dies with "Multiple top-level modules: main, turn_config".
# `packages = []` keeps tests/ out of the wheel.
[tool.setuptools]
py-modules = ["main", "turn_config", "long_practice", "warm_job"]
packages = []

